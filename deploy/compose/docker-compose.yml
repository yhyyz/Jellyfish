services:
  mysql:
    image: mysql:9.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  rustfs:
    image: rustfs/rustfs:latest
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data

  backend-init-db:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      DEBUG: "false"
      # S3 / RustFS
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_REGION_NAME: us-east-1
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      # CORS
      CORS_ORIGINS: http://localhost:7788,http://127.0.0.1:7788
      # 可选
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
    depends_on:
      mysql:
        condition: service_healthy
    command: ["uv", "run", "python", "init_db.py"]
    restart: "no"

  mysql-init-sql:
    image: mysql:9.0
    depends_on:
      mysql:
        condition: service_healthy
      backend-init-db:
        condition: service_completed_successfully
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ../../backend/sql:/sql:ro
    command:
      [
        "bash",
        "-lc",
        "set -e; for f in $$(find /sql -maxdepth 1 -type f -name '*.sql' | sort); do echo \"[mysql-init-sql] applying $$f\"; mysql --default-character-set=utf8mb4 -h mysql -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" < \"$$f\"; done",
      ]
    restart: "no"

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      DEBUG: "false"
      API_V1_PREFIX: /api/v1
      # S3 / RustFS
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_REGION_NAME: us-east-1
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      # CORS
      CORS_ORIGINS: http://localhost:7788,http://127.0.0.1:7788
      # 可选
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-init-db:
        condition: service_completed_successfully
      mysql-init-sql:
        condition: service_completed_successfully

  celery-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      DEBUG: "false"
      API_V1_PREFIX: /api/v1
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_REGION_NAME: us-east-1
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      CORS_ORIGINS: http://localhost:7788,http://127.0.0.1:7788
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-init-db:
        condition: service_completed_successfully
      mysql-init-sql:
        condition: service_completed_successfully
    # 直接使用镜像内已安装依赖的虚拟环境，避免运行时 `uv run` 临时拉包导致队列长时间 pending。
    command: [".venv/bin/celery", "-A", "app.core.celery_app:celery_app", "worker", "-l", "info"]

  # W24-T4：周期任务调度器。使用 RedBeat（基于 Redis 分布式锁），即使
  # 多实例部署也只会有一个进程实际触发 schedule，避免日/月配额被重置多次。
  # 与 celery-worker 共用同一镜像 + 同一 broker，仅启动参数不同。
  celery-beat:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      DEBUG: "false"
      API_V1_PREFIX: /api/v1
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_REGION_NAME: us-east-1
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      CORS_ORIGINS: http://localhost:7788,http://127.0.0.1:7788
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-init-db:
        condition: service_completed_successfully
      mysql-init-sql:
        condition: service_completed_successfully
    command:
      [
        ".venv/bin/celery",
        "-A",
        "app.core.celery_app:celery_app",
        "beat",
        "-l",
        "info",
        "--scheduler",
        "redbeat.RedBeatScheduler",
      ]
    restart: unless-stopped

  front:
    build:
      context: ../..
      dockerfile: deploy/docker/front.Dockerfile
    environment:
      BACKEND_URL: ${BACKEND_URL}
    ports:
      - "7788:80"
    depends_on:
      - backend

  # P4 W27-T1: DINOv2 ViT-B/14 视觉一致性 sidecar（DECISION D-VISION-DEPLOY=sidecar）。
  # 主 backend / celery-worker 通过 dinov2_sidecar_base_url=http://inference-dinov2:8001
  # 调用，本服务承担所有 torch/transformers ML 依赖，与主镜像完全解耦。
  inference-dinov2:
    build:
      context: ../inference-dinov2
      dockerfile: Dockerfile
    environment:
      HF_HOME: /models
      TRANSFORMERS_CACHE: /models
      HF_HUB_DISABLE_TELEMETRY: "1"
    ports:
      - "${DINOV2_SIDECAR_PORT:-8001}:8001"
    volumes:
      # 挂卷持久化模型权重（~330MB），避免每次重启容器重新下载。
      - dinov2_models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      # start_period 留 120s 给首次模型加载（HF Hub 网络速度差时需要）。
      start_period: 120s
      retries: 3
    restart: unless-stopped
    # GPU 加速可选：宿主机装 nvidia-container-toolkit 后，把以下 deploy 段
    # 取消注释（compose v2.20+ 原生支持 device 请求）。CPU 模式下保持注释即可。
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  mysql_data:
  rustfs_data:
  dinov2_models:
